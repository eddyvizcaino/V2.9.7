{% extends 'base.html' %}{% from '_macros.html' import csrf %}{% block content %}<h1>{{ title }}</h1><div class="panel"><form method="post">{{ csrf() }}<div class="form-grid"><label>Nombre de la comunidad<input name="Name" required maxlength="200" value="{{ c['Name'] or '' }}"></label><label>Líder 1<select name="LeaderMemberId"><option value="">— Sin asignar —</option>{% for m in members %}<option value="{{m['Id']}}" {{ 'selected' if c['LeaderMemberId']==m['Id'] else '' }}>{{m['MemberCode']}} · {{ ((m['FirstName'] or '')+' '+(m['LastName'] or '')).strip() or m['FullName'] }}</option>{% endfor %}</select></label><label>Líder 2<select name="Leader2MemberId"><option value="">— Sin asignar —</option>{% for m in members %}<option value="{{m['Id']}}" {{ 'selected' if c['Leader2MemberId']==m['Id'] else '' }}>{{m['MemberCode']}} · {{ ((m['FirstName'] or '')+' '+(m['LastName'] or '')).strip() or m['FullName'] }}</option>{% endfor %}</select></label><label>Estado<select name="Status"><option {{ 'selected' if c['Status']!='Inactiva' else '' }}>Activa</option><option {{ 'selected' if c['Status']=='Inactiva' else '' }}>Inactiva</option></select></label><label>Fecha de creación<input type="date" name="CreatedDate" value="{{ c['CreatedDate'] or '' }}"></label><label>Observaciones<textarea name="Notes" maxlength="2000">{{ c['Notes'] or '' }}</textarea></label></div><button class="btn save" type="submit">GUARDAR</button> <a class="btn cancel" href="{{ url_for('communities.index') }}">CANCELAR</a></form></div>{% endblock %}
